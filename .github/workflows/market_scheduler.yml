name: Ampolin AI Autonomous Cloud Scheduler

on:
  schedule:
    # NSE India: 09:15 IST (03:45 UTC) - Market Open Sweep
    - cron: '45 3 * * 1-5'
    # NSE India: 10:30 IST (05:00 UTC) - Morning Breakout Scan
    - cron: '0 5 * * 1-5'
    # NSE India: 13:45 IST (08:15 UTC) - Afternoon Breakout Scan
    - cron: '15 8 * * 1-5'
    # NSE India: 15:10 IST (09:40 UTC) - Pre-Close Profit Lock Sweep
    - cron: '40 9 * * 1-5'
    # NSE India: 15:45 IST (10:15 UTC) - EOD Reflection & Daily P&L
    - cron: '15 10 * * 1-5'
    # Wall Street: 19:30 IST (14:00 UTC) - US Market Open Scan
    - cron: '0 14 * * 1-5'
    # Wall Street: 22:00 IST (16:30 UTC) - US Mid-Day Momentum Scan
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to scan (NSE or US)'
        required: true
        default: 'NSE'

jobs:
  run-trading-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Market Cycle
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
        run: |
          python main.py --dry-run
